version: '2.3'

services:
  web:
    container_name: chitchat-qa
    restart: always
    build: .
    runtime: nvidia
    environment:
      - LANG=en_US.UTF-8
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX=once
    ports:
      - "3000:3000" #web-client
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: chitchat-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
